name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner image already ships the Android SDK (ANDROID_HOME is set).
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk KeepAwake.apk

      # Publish the APK as a plain file (not zipped) on the repo's Releases page.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Keep Awake (build ${{ github.run_number }})
          make_latest: true
          files: KeepAwake.apk
